<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aprendizaje Supervisado vs No Supervisado</title>
  <style>
    :root {
      --bg: #0a0c10;
      --card-bg-1: #5b5095;
      --card-bg-2: #161a23;
      --card-border: rgba(255, 255, 255, 0.15);
      --text-main: #ffffff;
      --text-muted: #e0e0e0;
      --accent-1: #818cf8;
      --accent-2: #c084fc;
      
      /* Colores para resaltado de sintaxis */
      --token-keyword: #ff79c6;
      --token-string: #f1fa8c;
      --token-number: #bd93f9;
      --token-function: #50fa7b;
      --token-variable: #8be9fd;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    /* Instrucción Flotante Superior */
    .floating-instruction {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      padding: 0.65rem 1.4rem;
      border-radius: 30px;
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      animation: float 3s ease-in-out infinite;
    }

    .floating-instruction svg {
      width: 18px;
      height: 18px;
      fill: var(--accent-1);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .cards-container {
      display: flex;
      gap: 2rem;
      max-width: 900px;
      width: 100%;
      justify-content: center;
      align-items: center;
      perspective: 1000px;
    }

    .card {
      flex: 1;
      max-width: 400px;
      height: 180px;
      border-radius: 20px;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: all 0.4s cubic-bezier(0.15, 0.83, 0.66, 1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--card-border);
      position: relative;
    }

    .card-1 {
      background-color: var(--card-bg-1);
    }

    .card-2 {
      background-color: var(--card-bg-2);
    }

    .card:hover {
      transform: translateY(-8px) scale(1.03);
    }

    .card-1:hover {
      box-shadow: 0 20px 40px rgba(129, 140, 248, 0.35);
      border-color: var(--accent-1);
    }

    .card-2:hover {
      box-shadow: 0 20px 40px rgba(192, 132, 252, 0.35);
      border-color: var(--accent-2);
    }

    .card h3 {
      font-size: 1.6rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 0.5rem;
    }

    .card .click-hint {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.7);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 0.5rem;
    }

    /* Modal 3D */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 100;
      perspective: 1200px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #12151e;
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 3rem;
      max-width: 650px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
      transform: rotateX(-20px) rotateY(15px) translateZ(-100px) scale(0.8);
      opacity: 0;
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
      transform-style: preserve-3d;
      color: var(--text-main);
    }

    .modal-overlay.active .modal-card {
      transform: rotateX(0deg) rotateY(0deg) translateZ(0) scale(1);
      opacity: 1;
    }

    .modal-card h2 {
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
      color: #ffffff;
      transform: translateZ(30px);
    }

    .modal-card p, .modal-card ul, .modal-card pre {
      transform: translateZ(20px);
    }

    .modal-card p {
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 1.2rem;
    }

    .modal-card ul {
      margin-left: 1.5rem;
      margin-bottom: 1.5rem;
      color: var(--text-muted);
    }

    .modal-card ul li {
      margin-bottom: 0.5rem;
      line-height: 1.5;
    }

    .modal-card pre {
      background-color: #0f111a;
      color: #f8f8f2;
      padding: 1.25rem;
      border-radius: 12px;
      overflow-x: auto;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.2rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .kw { color: var(--token-keyword); font-weight: bold; }
    .str { color: var(--token-string); }
    .num { color: var(--token-number); }
    .fn { color: var(--token-function); }
    .var { color: var(--token-variable); }

    .close-btn {
      position: absolute;
      top: 1.25rem;
      right: 1.25rem;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: background 0.3s;
      transform: translateZ(40px);
    }

    .close-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    @media (max-width: 650px) {
      .cards-container {
        flex-direction: column;
      }
      .card {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="floating-instruction">
    <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 15h-2v-6h2zm0-8h-2V7h2z"/></svg>
    Haga clic sobre las tarjetas para ampliar la información.
  </div>

  <div class="cards-container">
    <div class="card card-1" onclick="openModal(1)">
      <h3>1.3.1 Aprendizaje supervisado</h3>
      <span class="click-hint">Haz clic para ver más</span>
    </div>

    <div class="card card-2" onclick="openModal(2)">
      <h3>1.3.2 Aprendizaje no supervisado</h3>
      <span class="click-hint">Haz clic para ver más</span>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay" onclick="closeModalOnOverlay(event)">
    <div class="modal-card">
      <button class="close-btn" onclick="closeModal()" title="Cerrar (Esc)">✕</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script>
    const overlay = document.getElementById('modalOverlay');
    const modalContent = document.getElementById('modalContent');

    const cardData = {
      1: `
        <h2>1.3.1 Aprendizaje supervisado</h2>
        <p>El aprendizaje supervisado consiste en entrenar un modelo utilizando datos de entrada junto con una salida conocida. El objetivo es aprender la relación entre variables para luego predecir nuevos casos.</p>
        <p><strong>Se aplica principalmente en:</strong></p>
        <ul>
          <li><strong>Regresión:</strong> predicción de valores numéricos.</li>
          <li><strong>Clasificación:</strong> predicción de categorías.</li>
        </ul>
        <p><strong>Ejemplos comunes:</strong></p>
        <ul>
          <li>Predicción de precios de viviendas.</li>
          <li>Aprobación de créditos.</li>
          <li>Detección de spam.</li>
          <li>Predicción de ventas.</li>
        </ul>
        <p><strong>Ejemplo en Python:</strong></p>
        <pre><span class="kw">from</span> sklearn.linear_model <span class="kw">import</span> LinearRegression
<span class="kw">import</span> numpy <span class="kw">as</span> np

<span class="var">X</span> = np.<span class="fn">array</span>([[<span class="num">1</span>], [<span class="num">2</span>], [<span class="num">3</span>], [<span class="num">4</span>]])
<span class="var">y</span> = np.<span class="fn">array</span>([<span class="num">2</span>, <span class="num">4</span>, <span class="num">6</span>, <span class="num">8</span>])

<span class="var">modelo</span> = <span class="fn">LinearRegression</span>()
<span class="var">modelo</span>.<span class="fn">fit</span>(<span class="var">X</span>, <span class="var">y</span>)
<span class="fn">print</span>(<span class="var">modelo</span>.<span class="fn">predict</span>([[<span class="num">5</span>]]))</pre>
        <p>En este caso, el modelo aprende una relación entre X e y.</p>
      `,
      2: `
        <h2>1.3.2 Aprendizaje no supervisado</h2>
        <p>El aprendizaje no supervisado utiliza datos sin variable objetivo definida. El algoritmo busca identificar estructuras, agrupaciones o relaciones ocultas dentro del conjunto de datos.</p>
        <p><strong>Sus aplicaciones más comunes son:</strong></p>
        <ul>
          <li>Segmentación de clientes.</li>
          <li>Detección de anomalías.</li>
          <li>Reducción de dimensionalidad.</li>
          <li>Agrupamiento de comportamientos similares.</li>
        </ul>
        <p><strong>Ejemplo en Python:</strong></p>
        <pre><span class="kw">from</span> sklearn.cluster <span class="kw">import</span> KMeans
<span class="kw">import</span> numpy <span class="kw">as</span> np

<span class="var">X</span> = np.<span class="fn">array</span>([[<span class="num">1</span>,<span class="num">1</span>],[<span class="num">1.5</span>,<span class="num">2</span>],[<span class="num">5</span>,<span class="num">8</span>],[<span class="num">8</span>,<span class="num">8</span>]])

<span class="var">modelo</span> = <span class="fn">KMeans</span>(n_clusters=<span class="num">2</span>, random_state=<span class="num">0</span>)
<span class="var">modelo</span>.<span class="fn">fit</span>(<span class="var">X</span>)
<span class="fn">print</span>(<span class="var">modelo</span>.labels_)</pre>
        <p>El algoritmo agrupa automáticamente los datos en dos clusters.</p>
      `
    };

    function openModal(id) {
      modalContent.innerHTML = cardData[id];
      overlay.classList.add('active');
    }

    function closeModal() {
      overlay.classList.remove('active');
    }

    function closeModalOnOverlay(e) {
      if (e.target === overlay) closeModal();
    }

    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape' || event.key === 'Esc') {
        closeModal();
      }
    });
  </script>
</body>
</html>
