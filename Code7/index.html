<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Efecto Typing Python - Métricas de Clasificación</title>
  <style>
    /* Estilos generales */
    body {
      background-color: #121214;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      font-family: 'Fira Code', 'Cascadia Code', Consolas, Monaco, monospace;
    }

    /* Ventana tipo terminal */
    .code-window {
      background-color: #1e1e24;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      width: 100%;
      max-width: 820px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
    }

    /* Barra superior de la ventana */
    .window-header {
      background-color: #18181c;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-circle {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    .close { background-color: #ff5f56; }
    .minimize { background-color: #ffbd2e; }
    .maximize { background-color: #27c93f; }

    .window-title {
      color: #7a7a8c;
      font-size: 13px;
      margin-left: auto;
      margin-right: auto;
    }

    /* Área donde se escribe el código */
    .code-body {
      padding: 28px 32px;
      color: #d4d4d4;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      text-align: left;
    }

    /* Paleta de colores (Syntax Highlighting) */
    .token-keyword { color: #c586c0; font-weight: bold; } /* Palabras clave */
    .token-module  { color: #4ec9b0; }                     /* Módulos y funciones de métricas */
    .token-func    { color: #dcdcaa; }                     /* Funciones de impresión */
    .token-string  { color: #ce9178; }                     /* Cadenas de texto */

    /* Cursor parpadeante fino (estilo editor) */
    .cursor {
      display: inline-block;
      width: 2px;
      height: 16px;
      background-color: #ffffff;
      margin-left: 2px;
      vertical-align: middle;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="code-window">
    <div class="window-header">
      <span class="btn-circle close"></span>
      <span class="btn-circle minimize"></span>
      <span class="btn-circle maximize"></span>
      <span class="window-title">metricas_clasificacion.py</span>
    </div>
    <div class="code-body"><span id="code-content"></span><span class="cursor"></span></div>
  </div>

  <script>
    // Configuración de tokens adaptada al script de métricas de clasificación
    const tokens = [
      { text: "from", class: "token-keyword" },
      { text: " sklearn" },
      { text: ".metrics", class: "token-module" },
      { text: " " },
      { text: "import", class: "token-keyword" },
      { text: " accuracy_score, precision_score, recall_score, f1_score\n\n" },
      { text: "print", class: "token-func" },
      { text: "(" },
      { text: '"Accuracy:"', class: "token-string" },
      { text: ", " },
      { text: "accuracy_score", class: "token-module" },
      { text: "(y_real, y_pred))\n" },
      { text: "print", class: "token-func" },
      { text: "(" },
      { text: '"Precision:"', class: "token-string" },
      { text: ", " },
      { text: "precision_score", class: "token-module" },
      { text: "(y_real, y_pred))\n" },
      { text: "print", class: "token-func" },
      { text: "(" },
      { text: '"Recall:"', class: "token-string" },
      { text: ", " },
      { text: "recall_score", class: "token-module" },
      { text: "(y_real, y_pred))\n" },
      { text: "print", class: "token-func" },
      { text: "(" },
      { text: '"F1:"', class: "token-string" },
      { text: ", " },
      { text: "f1_score", class: "token-module" },
      { text: "(y_real, y_pred))" }
    ];

    const container = document.getElementById("code-content");
    let tokenIndex = 0;
    let charIndex = 0;
    let currentElement = null;

    function typeCode() {
      if (tokenIndex < tokens.length) {
        const currentToken = tokens[tokenIndex];

        if (charIndex === 0) {
          if (currentToken.class) {
            currentElement = document.createElement("span");
            currentElement.className = currentToken.class;
            container.appendChild(currentElement);
          } else {
            currentElement = document.createTextNode("");
            container.appendChild(currentElement);
          }
        }

        const char = currentToken.text.charAt(charIndex);
        if (currentToken.class) {
          currentElement.textContent += char;
        } else {
          currentElement.nodeValue += char;
        }

        charIndex++;

        if (charIndex === currentToken.text.length) {
          charIndex = 0;
          tokenIndex++;
        }

        setTimeout(typeCode, 25);
      }
    }

    setTimeout(typeCode, 500);
  </script>

</body>
</html>
