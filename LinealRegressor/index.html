<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modelos de Regresión</title>
  <style>
    /* Variables para Tema Oscuro (Predeterminado) */
    :root {
      --bg: #0a0c10;
      --card-bg: #161a23;
      --card-border: rgba(255, 255, 255, 0.15);
      --text-main: #ffffff;
      --text-muted: #e0e0e0;
      --accent: #818cf8;
      
      --modal-bg: #12151e;
      --code-bg: #0f111a;
      --close-btn-bg: rgba(255, 255, 255, 0.1);
      --close-btn-hover: rgba(255, 255, 255, 0.25);
      
      /* Sintaxis de código */
      --token-keyword: #ff79c6;
      --token-string: #f1fa8c;
      --token-number: #bd93f9;
      --token-function: #50fa7b;
      --token-variable: #8be9fd;
    }

    /* Variables para Tema Claro */
    [data-theme="light"] {
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --card-border: rgba(0, 0, 0, 0.1);
      --text-main: #1f2937;
      --text-muted: #4b5563;
      --accent: #4f46e5;
      
      --modal-bg: #ffffff;
      --code-bg: #1e1e2e; /* Mantiene un fondo oscuro cómodo para el código */
      --close-btn-bg: rgba(0, 0, 0, 0.08);
      --close-btn-hover: rgba(0, 0, 0, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      position: relative;
    }

    /* Botón Flotante para Alternar Tema */
    .theme-toggle-btn {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 0.6rem 1rem;
      border-radius: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      z-index: 10;
    }

    .theme-toggle-btn:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .theme-toggle-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Instrucción Flotante Superior */
    .floating-instruction {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(8px);
      padding: 0.65rem 1.4rem;
      border-radius: 30px;
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      animation: float 3s ease-in-out infinite;
    }

    .floating-instruction svg {
      width: 18px;
      height: 18px;
      fill: var(--accent);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .cards-container {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      max-width: 1000px;
      width: 100%;
      justify-content: center;
      align-items: center;
      perspective: 1000px;
    }

    .card {
      flex: 1 1 280px;
      max-width: 320px;
      height: 170px;
      background-color: var(--card-bg);
      border-radius: 20px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: transform 0.4s cubic-bezier(0.15, 0.83, 0.66, 1), box-shadow 0.4s, border-color 0.4s;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      border: 1px solid var(--card-border);
      position: relative;
    }

    .card:hover {
      transform: translateY(-8px) scale(1.03);
      box-shadow: 0 20px 40px rgba(79, 70, 229, 0.2);
      border-color: var(--accent);
    }

    .card h3 {
      font-size: 1.4rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 0.5rem;
      color: var(--text-main);
    }

    .card .click-hint {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 0.5rem;
      opacity: 0.8;
    }

    /* Modal 3D */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 100;
      perspective: 1200px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 3rem;
      max-width: 650px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
      transform: rotateX(-20px) rotateY(15px) translateZ(-100px) scale(0.8);
      opacity: 0;
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
      transform-style: preserve-3d;
      color: var(--text-main);
    }

    .modal-overlay.active .modal-card {
      transform: rotateX(0deg) rotateY(0deg) translateZ(0) scale(1);
      opacity: 1;
    }

    .modal-card h2 {
      font-size: 1.8rem;
      margin-bottom: 1.5rem;
      color: var(--text-main);
      transform: translateZ(30px);
    }

    .modal-card p, .modal-card ul, .modal-card pre {
      transform: translateZ(20px);
    }

    .modal-card p {
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 1.2rem;
    }

    .modal-card ul {
      margin-left: 1.5rem;
      margin-bottom: 1.5rem;
      color: var(--text-muted);
    }

    .modal-card ul li {
      margin-bottom: 0.5rem;
      line-height: 1.5;
    }

    .modal-card pre {
      background-color: var(--code-bg);
      color: #f8f8f2;
      padding: 1.25rem;
      border-radius: 12px;
      overflow-x: auto;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.2rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .kw { color: var(--token-keyword); font-weight: bold; }
    .fn { color: var(--token-function); }
    .var { color: var(--token-variable); }

    .close-btn {
      position: absolute;
      top: 1.25rem;
      right: 1.25rem;
      background: var(--close-btn-bg);
      border: none;
      color: var(--text-main);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: background 0.3s;
      transform: translateZ(40px);
    }

    .close-btn:hover {
      background: var(--close-btn-hover);
    }

    @media (max-width: 650px) {
      .cards-container {
        flex-direction: column;
      }
      .card {
        width: 100%;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

  <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()">
    <svg id="themeIcon" viewBox="0 0 24 24">
      <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>
    </svg>
    <span id="themeText">Tema Claro</span>
  </button>

  <div class="floating-instruction">
    <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 15h-2v-6h2zm0-8h-2V7h2z"/></svg>
    Haga clic sobre las tarjetas para ampliar la información.
  </div>

  <div class="cards-container">
    <div class="card" onclick="openModal(1)">
      <h3>A. Regresión lineal</h3>
      <span class="click-hint">Haz clic para ver más</span>
    </div>

    <div class="card" onclick="openModal(2)">
      <h3>B. Árbol de regresión</h3>
      <span class="click-hint">Haz clic para ver más</span>
    </div>

    <div class="card" onclick="openModal(3)">
      <h3>C. Random Forest Regressor</h3>
      <span class="click-hint">Haz clic para ver más</span>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay" onclick="closeModalOnOverlay(event)">
    <div class="modal-card">
      <button class="close-btn" onclick="closeModal()" title="Cerrar (Esc)">✕</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script>
    const overlay = document.getElementById('modalOverlay');
    const modalContent = document.getElementById('modalContent');
    const themeIcon = document.getElementById('themeIcon');
    const themeText = document.getElementById('themeText');

    // Datos del modal
    const cardData = {
      1: `
        <h2>A. Regresión lineal</h2>
        <p>Es uno de los modelos más utilizados por su simplicidad e interpretabilidad.</p>
        <pre><span class="kw">from</span> sklearn.linear_model <span class="kw">import</span> LinearRegression</pre>
        <p><strong>Usos comunes:</strong></p>
        <ul>
          <li>Predicción de ventas.</li>
          <li>Precios inmobiliarios.</li>
          <li>Proyección de demanda.</li>
        </ul>
      `,
      2: `
        <h2>B. Árbol de regresión</h2>
        <p>Divide los datos en reglas jerárquicas para estimar valores.</p>
        <pre><span class="kw">from</span> sklearn.tree <span class="kw">import</span> DecisionTreeRegressor</pre>
        <p><strong>Ventaja:</strong> captura relaciones no lineales.</p>
      `,
      3: `
        <h2>C. Random Forest Regressor</h2>
        <p>Combina múltiples árboles para mejorar precisión y estabilidad.</p>
        <pre><span class="kw">from</span> sklearn.ensemble <span class="kw">import</span> RandomForestRegressor</pre>
        <p>Es ampliamente usado en problemas empresariales.</p>
      `
    };

    // Funciones del Modal
    function openModal(id) {
      modalContent.innerHTML = cardData[id];
      overlay.classList.add('active');
    }

    function closeModal() {
      overlay.classList.remove('active');
    }

    function closeModalOnOverlay(e) {
      if (e.target === overlay) closeModal();
    }

    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape' || event.key === 'Esc') {
        closeModal();
      }
    });

    // Lógica para alternar entre Tema Oscuro y Tema Claro
    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      
      if (currentTheme === 'light') {
        document.documentElement.removeAttribute('data-theme');
        themeText.textContent = 'Tema Claro';
        // Icono de Sol
        themeIcon.innerHTML = `<path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>`;
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        themeText.textContent = 'Tema Oscuro';
        // Icono de Luna
        themeIcon.innerHTML = `<path d="M12.3 2a10 10 0 0 0-1.9 20 10 10 0 0 0 9.2-6 1 1 0 0 0-1.1-1.37 8 8 0 1 1-7.6-11.53 1 1 0 0 0 1.4-1.1z"/>`;
      }
    }
  </script>
</body>
</html>
